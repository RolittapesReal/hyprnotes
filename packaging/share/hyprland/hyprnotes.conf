# Hyprnotes integration for hyprlang configs (source = ~/.config/hypr/hyprnotes.conf).
# Syntax below is the 0.53+ "windowrule = match:..., effect value" form. NOT verified on this
# machine if your compositor rejects it; see README.md. Use hyprnotes.lua for Lua configs.

windowrule = match:initial_title ^hyprnotes-sticky:, float on, size 360 300
windowrule = match:initial_title ^hyprnotes-organizer:, float on, size 960 640, center on

bind = SUPER, N, exec, hyprnotes --new-note
bind = SUPER SHIFT, N, exec, hyprnotes --show-organizer

# Optional autostart (skip if you enabled Hyprnotes' own autostart setting):
# exec-once = hyprnotes --background
